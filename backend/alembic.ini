# Configuración de Alembic. La URL de la base NO se escribe aquí: se arma desde
# la configuración del proceso (atlas.configuracion) con el usuario de migración.
[alembic]
script_location = %(here)s/migraciones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os

[loggers]
keys = root

[handlers]
keys = consola

[formatters]
keys = generico

[logger_root]
level = WARNING
handlers = consola

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
formatter = generico

[formatter_generico]
format = %(levelname)s [%(name)s] %(message)s
