[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS — gestión de documentos y contratos con trazabilidad (PFI UADE 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.159,<1",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
]

[project.optional-dependencies]
desarrollo = [
    "uvicorn[standard]>=0.54,<1",
    "httpx>=0.28,<1",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integracion: requiere PostgreSQL con pgvector real (base atlas_tests)",
]

[tool.coverage.run]
source = ["atlas"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["atlas"]
