[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS — gestión de documentos y contratos con trazabilidad (PFI UADE 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.159,<1",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "PyJWT[crypto]>=2.15,<3",
    "boto3>=1.43,<2",
    "pypdf>=6.21,<7",
    # FastAPI en Lambda detrás de API Gateway.
    "mangum>=0.19,<0.20",
]

[project.optional-dependencies]
desarrollo = [
    "uvicorn[standard]>=0.54,<1",
    "httpx>=0.28,<1",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    # Simulación local de S3 y Step Functions: nunca en el paquete desplegado.
    "moto[server]>=5.2,<6",
    # Escenarios de aceptación en Gherkin.
    "pytest-bdd>=8.1,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"atlas.procesamiento" = ["*.asl.json"]
"atlas.procesamiento.instrucciones" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
bdd_features_base_dir = "../tests/acceptance/features"
markers = [
    "integracion: requiere PostgreSQL con pgvector real (base atlas_tests)",
    # Etiquetas de los .feature (pytest-bdd las convierte en marcadores): trazabilidad.
    "evd_01", "cadena_evidencia", "evd_a", "evd_b", "evd_c", "evd_n12",
    "rf_04", "rf_05", "rf_07", "rn_08", "rn_09", "rn_12", "rn_13", "rnf_01",
    "rf_09", "rf_12", "rn_02", "rn_03", "punto_demo_a",
    "rf_13", "rn_04", "punto_demo_b",
    "rf_14", "rf_15", "rf_16", "rn_05", "rn_06", "punto_demo_c",
    "rf_17", "rf_18", "rf_19", "rf_20", "rf_22", "punto_demo_d",
]

[tool.coverage.run]
source = ["atlas"]
branch = true

[tool.coverage.report]
show_missing = true
# Arranque por línea de comandos de las herramientas: se prueba llamando a main().
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff.lint.isort]
known-first-party = ["atlas", "herramientas_ci", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["atlas"]

# boto3/botocore no publican tipos; se usan detrás de los puertos de atlas.integraciones.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
